<template>
    <article class="slds-card timeline-card">
        <!-- ================= GRADIENT HEADER BAND ================= -->
        <div class="header-band">
            <div class="header-band-inner">
                <div class="header-icon-tile">
                    <lightning-icon icon-name="standard:asset_object" size="small"></lightning-icon>
                </div>
                <div class="header-text">
                    <h2 class="header-title">Asset Renewal Timeline</h2>
                    <p class="header-subtitle">
                        Next 18 months of Asset expirations — <span class="header-stamp">Protect every child, every school, every day.</span>
                    </p>
                </div>
                <!-- Summary chips -->
                <div class="header-stats">
                    <span class="stat-chip stat-chip_needs">
                        <span class="stat-dot"></span>
                        {needsRenewalCount} Need Renewal
                    </span>
                    <span class="stat-chip stat-chip_linked">
                        <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                        {renewedCount} Renewed
                    </span>
                </div>
            </div>
        </div>

        <!-- ================= FILTERS ================= -->
        <div class="slds-card__body">
            <div class="filters slds-grid slds-wrap slds-m-bottom_medium">
                <div class="slds-col slds-size_12 slds-medium-size_6 slds-p-right_medium">
                    <lightning-combobox
                        name="familyFilter"
                        label="Product Family"
                        placeholder="All Families"
                        value={familyFilter}
                        options={familyOptions}
                        onchange={handleFamilyChange}
                    ></lightning-combobox>
                </div>
                <div class="slds-col slds-size_12 slds-medium-size_6">
                    <lightning-combobox
                        name="statusFilter"
                        label="Renewal Status"
                        placeholder="All Statuses"
                        value={statusFilter}
                        options={statusOptions}
                        onchange={handleStatusChange}
                    ></lightning-combobox>
                </div>
            </div>

            <!-- ================= EMPTY / LOADING STATES ================= -->
            <template if:true={hasError}>
                <div class="slds-p-around_medium slds-text-align_center slds-text-color_error">
                    {errorMessage}
                </div>
            </template>

            <template if:false={hasError}>
                <!-- Loading skeleton -->
                <div class="slds-align_absolute-center slds-p-vertical_medium" if:true={isLoading}>
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>

                <!-- Empty state -->
                <div class="slds-p-vertical_large slds-text-align_center" if:true={showEmpty}>
                    <lightning-icon
                        icon-name="utility:check"
                        size="medium"
                        alternative-text="All caught up"
                    ></lightning-icon>
                    <p class="slds-text-body_regular slds-m-top_small">
                        No Asset expirations in the next 18 months.
                    </p>
                </div>

                <!-- ================= TIMELINE ================= -->
                <template if:true={showTimeline}>
                    <div class="timeline-scroll">
                        <div class="timeline">
                            <!-- Month axis header -->
                            <div class="timeline-axis">
                                <template for:each={monthCells} for:item="cell">
                                    <div
                                        key={cell.key}
                                        class="timeline-axis-month"
                                        style={cell.axisStyle}
                                    >
                                        <span class="axis-month-label">{cell.label}</span>
                                    </div>
                                </template>
                            </div>

                            <!-- Quarter markers row -->
                            <div class="timeline-quarters">
                                <template for:each={quarterCells} for:item="quarter">
                                    <div
                                        key={quarter.key}
                                        class="timeline-quarter-marker"
                                        style={quarter.markerStyle}
                                    >
                                        <span class="quarter-dot"></span>
                                    </div>
                                </template>
                            </div>

                            <!-- Today marker -->
                            <div class="today-marker" style={todayMarkerStyle}>
                                <span class="today-tag">Today</span>
                            </div>

                            <!-- Axis line -->
                            <div class="timeline-line"></div>

                            <!-- Asset lanes -->
                            <div class="timeline-lanes">
                                <template for:each={lanes} for:item="lane">
                                    <div key={lane.id} class="timeline-lane">
                                        <template for:each={lane.assets} for:item="node">
                                            <div
                                                key={node.assetId}
                                                class={node.tlClass}
                                                style={node.positionStyle}
                                                data-asset-id={node.assetId}
                                                onclick={handleNodeClick}
                                                onmouseenter={handleMouseEnter}
                                                onmouseleave={handleMouseLeave}
                                                role="button"
                                                tabindex="0"
                                                onkeydown={handleNodeKeydown}
                                                aria-label={node.assetName}
                                            >
                                                <!-- Mini-card node -->
                                                <div class="tl-node-card">
                                                    <span class="tl-node-bubble">
                                                        <lightning-icon
                                                            if:true={node.isLinked}
                                                            icon-name="utility:check"
                                                            size="x-small"
                                                            alternative-text="Renewal created"
                                                        ></lightning-icon>
                                                    </span>
                                                    <span class="tl-node-info">
                                                        <span class="tl-node-name slds-truncate">{node.assetName}</span>
                                                        <span class="tl-node-date">{node.shortDate}</span>
                                                    </span>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>

                            <!-- ================= CUSTOM TOOLTIP ================= -->
                            <template if:true={tooltipData}>
                                <div
                                    class="tl-tooltip"
                                    style={tooltipStyle}
                                    role="tooltip"
                                >
                                    <div class="tl-tooltip-title slds-truncate">
                                        {tooltipData.assetName}
                                    </div>
                                    <div class="tl-tooltip-row">
                                        <span class="slds-text-color_weak">Expires:</span>
                                        {tooltipData.expirationLabel}
                                    </div>
                                    <div class="tl-tooltip-row">
                                        <span class="slds-text-color_weak">Status:</span>
                                        {tooltipData.status}
                                    </div>
                                    <div class="tl-tooltip-row">
                                        <span class="slds-text-color_weak">Purchased By:</span>
                                        {tooltipData.purchasedBy}
                                    </div>
                                    <div class="tl-tooltip-badge {tooltipData.badgeClass}">
                                        {tooltipData.badgeText}
                                    </div>
                                </div>
                            </template>

                            <!-- ================= POPOUT ACTION MENU =================
                                 Appears when a non-linked node is clicked. Offers a
                                 single renewal, or entering multi-select mode. -->
                            <template if:true={menuAsset}>
                                <div class="tl-menu" style={menuStyle} role="menu">
                                    <button
                                        class="tl-menu-item"
                                        onclick={handleMenuRenewSingle}
                                        role="menuitem"
                                    >
                                        <lightning-icon
                                            icon-name="utility:refresh"
                                            size="xx-small"
                                            class="tl-menu-icon"
                                        ></lightning-icon>
                                        <span class="tl-menu-item-text">
                                            <span class="tl-menu-item-title">Renew This Item</span>
                                            <span class="tl-menu-item-sub">Create a renewal for {menuAssetName}</span>
                                        </span>
                                    </button>
                                    <div class="tl-menu-sep"></div>
                                    <button
                                        class="tl-menu-item"
                                        onclick={handleMenuSelectMultiple}
                                        role="menuitem"
                                    >
                                        <lightning-icon
                                            icon-name="utility:add"
                                            size="xx-small"
                                            class="tl-menu-icon"
                                        ></lightning-icon>
                                        <span class="tl-menu-item-text">
                                            <span class="tl-menu-item-title">Select Multiple</span>
                                            <span class="tl-menu-item-sub">Group several Assets into one renewal</span>
                                        </span>
                                    </button>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- ================= FLOATING BATCH ACTION BAR =================
                         Visible while in multi-select mode. Groups all selected
                         Assets into a single Renewal Opportunity. -->
                    <template if:true={selectMode}>
                        <div class="batch-bar" role="toolbar">
                            <div class="batch-bar-left">
                                <span class="batch-count">{selectedAssetIds.length} selected</span>
                                <span class="batch-names slds-truncate" title={selectedNamesLabel}>
                                    {selectedNamesLabel}
                                </span>
                                <span class="batch-target">
                                    Opportunity for: {batchTargetAccountName}
                                </span>
                            </div>
                            <div class="batch-bar-actions">
                                <lightning-button
                                    label="Cancel"
                                    variant="neutral"
                                    class="slds-m-right_x-small"
                                    onclick={cancelSelection}
                                ></lightning-button>
                                <lightning-button
                                    label="Create Grouped Renewal"
                                    variant="brand"
                                    disabled={isCreating}
                                    onclick={confirmBulkCreate}
                                ></lightning-button>
                            </div>
                        </div>
                    </template>

                    <!-- Bottom legend hint for dense timelines -->
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_small slds-text-align_center">
                        Tip: Click a node to create a Renewal Opportunity, or open an existing one.
                    </p>
                </template>
            </template>
        </div>

        <!-- ================= CONFIRMATION MODAL (State 1) ================= -->
        <template if:true={showModal}>
            <section
                role="dialog"
                tabindex="-1"
                aria-modal="true"
                aria-labelledby="modalHeading"
                class="slds-modal slds-fade-in-open"
            >
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 id="modalHeading" class="slds-text-heading_medium">
                            Create Renewal Opportunity
                        </h2>
                        <button
                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={closeModal}
                        >
                            <lightning-icon
                                icon-name="utility:close"
                                alternative-text="Close"
                                size="small"
                            ></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p>
                            Create Renewal Opportunity for
                            <strong>{modalAssetName}</strong>?
                        </p>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">
                            Expires {modalExpirationLabel} · {modalProductFamily}
                        </p>
                        <template if:true={modalIsExternalPurchase}>
                            <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_warning slds-m-top_medium" role="alert">
                                <h2 class="slds-text-body_regular">
                                    This asset was purchased by {modalPurchaserName}. The Opportunity will be created for {modalPurchaserName} with this asset's product(s).
                                </h2>
                            </div>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Cancel"
                            variant="neutral"
                            onclick={closeModal}
                        ></lightning-button>
                        <lightning-button
                            label={modalConfirmLabel}
                            variant="brand"
                            onclick={confirmCreate}
                            disabled={isCreating}
                        ></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </article>
</template>
