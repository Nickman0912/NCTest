<template>
  <article class="slds-card dd-card">
    <!-- Header -->
    <div class="header-band">
      <div class="aurora aurora-a"></div>
      <div class="aurora aurora-b"></div>
      <div class="aurora aurora-c"></div>

      <div class="header-inner">
        <!-- Ethereal AI avatar -->
        <div class="avatar-wrap" data-element="avatarWrap">
          <div class="orb" data-state={avatarState}>
            <div class="orb-core"></div>
            <div class="orb-ring"></div>
            <div class="orb-halo"></div>
          </div>
        </div>

        <div class="header-text">
          <h2 class="header-title">RFP Deep Dive</h2>
          <p class="header-subtitle">Ask questions about the bid documents</p>
        </div>

        <div class="status-pill" data-state={avatarState}>
          <span class="status-dot"></span>
          <span class="status-label">{avatarLabel}</span>
        </div>
      </div>
    </div>

    <div class="dd-body">
      <!-- Not configured warning -->
      <template if:true={showConfigWarning}>
        <div class="config-warning">
          <lightning-icon
            icon-name="utility:warning"
            size="x-small"
          ></lightning-icon>
          <span
            >RFP Triage isn't configured. Populate the RFP Triage Config custom
            metadata record.</span
          >
        </div>
      </template>

      <!-- Contractor portal link -->
      <template if:true={hasPortalUrl}>
        <div class="portal-link">
          <lightning-icon
            icon-name="utility:link"
            size="x-small"
          ></lightning-icon>
          <a href={portalUrl} target="_blank" rel="noopener noreferrer"
            >Open contractor portal to download documents</a
          >
        </div>
      </template>

      <!-- Document upload (direct-to-GCS) -->
      <div class="upload-section">
        <label class="upload-label">Bid documents</label>
        <input
          type="file"
          multiple
          onchange={handleFileChange}
          accept=".pdf,.docx,.txt"
          class="file-input"
        />

        <!-- Already-ingested documents (persist across page reloads) -->
        <template if:true={hasDocuments}>
          <div class="doc-list">
            <template for:each={documents} for:item="doc">
              <div key={doc.key} class="doc-row">
                <lightning-icon
                  icon-name="utility:check"
                  size="xx-small"
                  class="doc-check"
                ></lightning-icon>
                <span class="doc-name">{doc.label}</span>
              </div>
            </template>
          </div>
        </template>
        <template if:false={hasDocuments}>
          <p class="doc-empty">
            No documents indexed yet. Upload the bid documents to enable the AI
            assistant.
          </p>
        </template>

        <template for:each={uploads} for:item="u">
          <div key={u.key} class="upload-row">
            <span class="upload-name">{u.name}</span>
            <span class={u.statusClass}>{u.status}</span>
          </div>
        </template>
      </div>

      <!-- Actions toolbar: Generate Summary & Browse Plan Sheets -->
      <div class="actions-row">
        <button
          class="summary-btn"
          onclick={handleSummarize}
          disabled={summaryDisabled}
        >
          <lightning-icon
            icon-name="utility:summary"
            size="x-small"
          ></lightning-icon>
          {summaryButtonLabel}
        </button>

        <template if:true={hasDrawingSheets}>
          <button
            class="sheets-btn"
            onclick={handleOpenSheetsModal}
          >
            <lightning-icon
              icon-name="utility:photo"
              size="x-small"
            ></lightning-icon>
            {sheetsButtonLabel}
          </button>
        </template>
      </div>

      <!-- Suggested questions -->
      <div class="quick-actions" if:false={hasMessages}>
        <p class="quick-label">Try asking:</p>
        <template for:each={suggestedQuestions} for:item="q">
          <button
            key={q}
            class="qa-btn"
            data-question={q}
            onclick={handleSuggested}
            disabled={qaDisabled}
          >
            {q}
          </button>
        </template>
      </div>

      <!-- Chat thread -->
      <div class="chat-thread" data-element="chatThread">
        <template for:each={messages} for:item="msg">
          <div key={msg.id} class={msg.rowClass}>
            <div class="msg-bubble">
              <p class="msg-text">{msg.text}</p>

              <!-- Interactive Visual Plan Sheet Cards directly in the chat bubble -->
              <template if:true={msg.hasVisualCards}>
                <div class="visual-cards-grid">
                  <template for:each={msg.visualCards} for:item="vc">
                    <div
                      key={vc.key}
                      class="visual-card"
                      data-url={vc.imageUrl}
                      data-label={vc.label}
                      onclick={handleOpenImage}
                    >
                      <div class="visual-card-thumb-wrap">
                        <img src={vc.imageUrl} alt={vc.label} class="visual-card-thumb" />
                        <div class="visual-card-overlay">
                          <lightning-icon icon-name="utility:preview" size="x-small" class="preview-icon"></lightning-icon>
                          <span>Open Full Size</span>
                        </div>
                      </div>
                      <div class="visual-card-info">
                        <span class="visual-card-title">{vc.label}</span>
                        <span class="visual-card-desc">{vc.description}</span>
                      </div>
                    </div>
                  </template>
                </div>
              </template>

              <!-- Citations: hidden behind an accordion toggle -->
              <template if:true={msg.hasCitations}>
                <button
                  class="cite-toggle"
                  data-msgid={msg.id}
                  onclick={handleToggleCitations}
                >
                  <lightning-icon
                    icon-name="utility:quote"
                    size="xx-small"
                  ></lightning-icon>
                  {msg.citationToggleLabel}
                </button>
                <div class="citations" if:true={msg.citationsExpanded}>
                  <template for:each={msg.citations} for:item="cit">
                    <div key={cit.key} class="citation">
                      <template if:true={cit.isVisual}>
                        <button
                          class="cite-thumb-btn"
                          data-url={cit.imageUrl}
                          data-label={cit.file}
                          onclick={handleOpenImage}
                        >
                          <img src={cit.imageUrl} alt={cit.file} class="cite-thumb" />
                          <span class="citation-file">{cit.file} &mdash; page {cit.page}</span>
                        </button>
                      </template>
                      <template if:false={cit.isVisual}>
                        <span class="citation-file"
                          >{cit.file} &mdash; section {cit.chunk}</span
                        >
                        <span class="citation-excerpt">{cit.excerpt}</span>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </template>

        <template if:true={isThinking}>
          <div class="msg-row msg-ai">
            <div class="msg-bubble typing">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
        </template>
      </div>

      <!-- Input -->
      <div class="input-row">
        <textarea
          class="input-box"
          placeholder={inputPlaceholder}
          value={draft}
          oninput={handleInput}
          onkeydown={handleKeyDown}
          rows="2"
          disabled={chatDisabled}
        ></textarea>
        <button class="send-btn" onclick={handleSend} disabled={sendDisabled}>
          <lightning-icon
            icon-name="utility:send"
            size="x-small"
          ></lightning-icon>
        </button>
      </div>
    </div>

    <!-- Browse Plan Sheets Modal / Drawer -->
    <template if:true={showSheetsModal}>
      <div class="sheets-modal-backdrop" onclick={handleCloseSheetsModal}>
        <div class="sheets-modal-panel" onclick={handleModalClick}>
          <div class="sheets-modal-header">
            <div class="sheets-header-left">
              <lightning-icon icon-name="utility:photo" size="small" class="header-photo-icon"></lightning-icon>
              <div>
                <h3 class="sheets-modal-title">Plan & Drawing Sheets</h3>
                <p class="sheets-modal-subtitle">{drawingSheetsCount} sheets indexed for this bid package</p>
              </div>
            </div>
            <button class="modal-close-btn" onclick={handleCloseSheetsModal}>
              <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
            </button>
          </div>

          <!-- Search / Filter input -->
          <div class="sheets-search-bar">
            <lightning-icon icon-name="utility:search" size="x-small" class="search-icon"></lightning-icon>
            <input
              type="text"
              placeholder="Search by sheet number, room, floor, or trade (e.g. A02.01, electrical, level 1)..."
              value={sheetsFilter}
              oninput={handleSheetsSearch}
              class="sheets-search-input"
            />
          </div>

          <!-- Sheet Grid -->
          <div class="sheets-grid">
            <template if:true={hasFilteredSheets}>
              <template for:each={filteredDrawingSheets} for:item="sheet">
                <div
                  key={sheet.key}
                  class="sheet-tile"
                  data-url={sheet.imageUrl}
                  data-label={sheet.label}
                  onclick={handleOpenImage}
                >
                  <div class="sheet-tile-img-wrap">
                    <img src={sheet.imageUrl} alt={sheet.label} class="sheet-tile-img" />
                    <div class="sheet-tile-hover">
                      <lightning-icon icon-name="utility:expand" size="x-small" class="expand-icon"></lightning-icon>
                      <span>View Full Size</span>
                    </div>
                  </div>
                  <div class="sheet-tile-meta">
                    <span class="sheet-tile-page">Page {sheet.page}</span>
                    <span class="sheet-tile-desc">{sheet.description}</span>
                  </div>
                </div>
              </template>
            </template>
            <template if:false={hasFilteredSheets}>
              <div class="sheets-empty-filter">
                <p>No plan sheets match "{sheetsFilter}".</p>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>

    <!-- Lightbox preview for visual citations -->
    <template if:true={showLightbox}>
      <div class="lightbox-backdrop" onclick={handleCloseLightbox}>
        <div class="lightbox-panel" onclick={handleCloseLightbox}>
          <img src={lightboxUrl} alt={lightboxLabel} class="lightbox-img" />
          <p class="lightbox-caption">{lightboxLabel}</p>
        </div>
      </div>
    </template>
  </article>
</template>
